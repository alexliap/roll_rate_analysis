[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roll-rate-analysis"
version = "0.2.0"
description = "Roll rate analysis for credit risk scorecards."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexandros Liapatis", email = "alexandrosliapatis@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "polars>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]

[project.urls]
Source = "https://github.com/alexliap/roll_rate_analysis"

[tool.hatch.build.targets.wheel]
packages = ["src/roll_rate_analysis"]

[tool.hatch.build.targets.sdist]
include = [
    "src/roll_rate_analysis",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pre-commit>=3",
    "ruff>=0.6",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/_build", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
